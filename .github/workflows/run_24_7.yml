name: GTA 6 24-7 Viral Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pro Video & Audio Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation nodejs
          pip install -U yt-dlp pytubefix faster-whisper google-genai requests pillow

      - name: Run GTA 6 Viral Agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_brain.py

      - name: Save Agent Memory
        run: |
          git config --global user.name "GTA6-Agent"
          git config --global user.email "agent@github.com"
          git add agent_state.json || true
          git diff --staged --quiet || git commit -m "Update agent memory"
          git push || true
